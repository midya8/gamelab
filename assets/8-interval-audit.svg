<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1100" viewBox="0 0 1120 1100">
<rect width="1120" height="1100" fill="#f4f1ed"/><rect x="16" y="16" width="1088" height="1068" rx="18" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#292929}.muted{fill:#666}</style>
<text x="42" y="58" font-size="26" font-weight="700">GameLab / worst regrets must share one payoff table</text>
<text x="42" y="89" font-size="17" class="muted">Exact fixed-policy box audits. Row maximizes; column minimizes. Supplied intervals, not confidence intervals.</text>
<text x="42" y="137" font-size="21" font-weight="700">1 One uncertain entry makes separate worst deviations incompatible</text>
<text x="42" y="170" font-size="17" >Both policies choose action 0. Only A[0,0] varies from 0 to 2; all other payoffs are 1.</text>
<text x="70" y="212" font-size="16" font-weight="700">Lower matrix</text>
<rect x="70" y="229" width="61" height="41" rx="4" fill="#d8ede7"/>
<text x="94" y="256" font-size="18" id="cell-lower-0-0" data-value="0">0</text>
<rect x="138" y="229" width="61" height="41" rx="4" fill="#ececec"/>
<text x="162" y="256" font-size="18" id="cell-lower-0-1" data-value="1">1</text>
<rect x="70" y="277" width="61" height="41" rx="4" fill="#ececec"/>
<text x="94" y="304" font-size="18" id="cell-lower-1-0" data-value="1">1</text>
<rect x="138" y="277" width="61" height="41" rx="4" fill="#ececec"/>
<text x="162" y="304" font-size="18" id="cell-lower-1-1" data-value="1">1</text>
<text x="315" y="212" font-size="16" font-weight="700">Upper matrix</text>
<rect x="315" y="229" width="61" height="41" rx="4" fill="#d8ede7"/>
<text x="339" y="256" font-size="18" id="cell-upper-0-0" data-value="2">2</text>
<rect x="383" y="229" width="61" height="41" rx="4" fill="#ececec"/>
<text x="407" y="256" font-size="18" id="cell-upper-0-1" data-value="1">1</text>
<rect x="315" y="277" width="61" height="41" rx="4" fill="#ececec"/>
<text x="339" y="304" font-size="18" id="cell-upper-1-0" data-value="1">1</text>
<rect x="383" y="277" width="61" height="41" rx="4" fill="#ececec"/>
<text x="407" y="304" font-size="18" id="cell-upper-1-1" data-value="1">1</text>
<text x="570" y="241" font-size="16" >Exact shared-table worst gap</text>
<text x="1015" y="241" font-size="18" id="cell-shared-gap" data-value="1">1</text>
<text x="570" y="279" font-size="16" >Sum of separate worst deviations</text>
<text x="1015" y="279" font-size="18" id="cell-separate" data-value="2">2</text>
<text x="570" y="317" font-size="16" >Attainable game-value range width</text>
<text x="1015" y="317" font-size="18" id="cell-value-width" data-value="0">0</text>
<text x="570" y="355" font-size="16" >Robust-security pair worst gap</text>
<text x="1015" y="355" font-size="18" id="cell-robust-gap" data-value="0">0</text>
<text x="42" y="400" font-size="16" font-weight="700">A[0,0]</text>
<text x="220" y="400" font-size="16" font-weight="700">Row deviation gain</text>
<text x="475" y="400" font-size="16" font-weight="700">Column deviation gain</text>
<text x="800" y="400" font-size="16" font-weight="700">Joint gap</text>
<text x="65" y="443" font-size="18" id="cell-probe-0-entry" data-value="0">0</text>
<text x="285" y="443" font-size="18" id="cell-probe-0-row" data-value="1">1</text>
<text x="560" y="443" font-size="18" id="cell-probe-0-column" data-value="0">0</text>
<text x="835" y="443" font-size="18" id="cell-probe-0-gap" data-value="1">1</text>
<text x="65" y="486" font-size="18" id="cell-probe-1-entry" data-value="1">1</text>
<text x="285" y="486" font-size="18" id="cell-probe-1-row" data-value="0">0</text>
<text x="560" y="486" font-size="18" id="cell-probe-1-column" data-value="0">0</text>
<text x="835" y="486" font-size="18" id="cell-probe-1-gap" data-value="0">0</text>
<text x="65" y="529" font-size="18" id="cell-probe-2-entry" data-value="2">2</text>
<text x="285" y="529" font-size="18" id="cell-probe-2-row" data-value="0">0</text>
<text x="560" y="529" font-size="18" id="cell-probe-2-column" data-value="1">1</text>
<text x="835" y="529" font-size="18" id="cell-probe-2-gap" data-value="1">1</text>
<text x="42" y="580" font-size="17" >Row worst needs A[0,0]=0; column worst needs A[0,0]=2. No single table attains both.</text>
<text x="42" y="613" font-size="17" >The game value is always 1. Lower-game row / upper-game column policies are robust equilibria here.</text>
<text x="42" y="675" font-size="21" font-weight="700">2 A fully variable 2x2 box still has shared-entry cancellation</text>
<text x="42" y="709" font-size="17" >All four entries range from 0 to 1. Both fixed policies mix [1/2,1/2].</text>
<text x="55" y="753" font-size="16" font-weight="700">Exact shared worst gap</text>
<text x="105" y="790" font-size="18" id="cell-full-gap" data-value="1/2">1/2</text>
<text x="390" y="753" font-size="16" font-weight="700">Separate worst sum</text>
<text x="440" y="790" font-size="18" id="cell-full-separate" data-value="1">1</text>
<text x="750" y="753" font-size="16" font-weight="700">Value range width</text>
<text x="800" y="790" font-size="18" id="cell-full-width" data-value="1">1</text>
<text x="42" y="832" font-size="17" >For reply pair (0,0), the coefficient of A[0,0] is 1/2 - 1/2 = 0, not two independent choices.</text>
<text x="42" y="885" font-size="21" font-weight="700">3 A one-action game can have uncertain value but zero exploitability</text>
<text x="42" y="922" font-size="17" >Single entry [-50,50]: value range width</text>
<text x="450" y="922" font-size="18" id="cell-singleton-width" data-value="100">100</text>
<text x="580" y="922" font-size="17" >but every pair gap is</text>
<text x="800" y="922" font-size="18" id="cell-singleton-gap" data-value="0">0</text>
<text x="42" y="971" font-size="16" >Every pure reply pair retains signed coefficients, endpoint choices, contributions and an attaining matrix.</text>
<text x="42" y="1006" font-size="15" class="muted">Endpoint games certify attainable value extrema and separate robust security, not an optimal worst-gap pair.</text>
<text x="42" y="1037" font-size="15" class="muted">No coupled uncertainty, statistical coverage, payoff-estimation or general-sum claim.</text>
