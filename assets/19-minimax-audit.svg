<style>text{font-family:Arial,sans-serif;fill:#292929}.muted{fill:#666}</style>
<text x="42" y="58" font-size="26" font-weight="700">GameLab / minimax value is unique; the strategy may not be</text>
<text x="42" y="88" font-size="17" class="muted">Exact small zero-sum games: row maximizes payoff, column minimizes. No training or payoff sampling.</text>
<text x="42" y="134" font-size="21" font-weight="700">1 Cyclic scores defeat a single-policy ranking</text>
<text x="65" y="172" font-size="15" class="muted">Column action</text>
<text x="130" y="200" font-size="16" >0</text>
<text x="222" y="200" font-size="16" >1</text>
<text x="314" y="200" font-size="16" >2</text>
<text x="65" y="239" font-size="16" >0</text>
<rect x="100" y="213" width="85" height="47" rx="4" fill="#ececec"/>
<text x="131" y="243" font-size="18" id="cell-matrix-0-0" data-value="0">0</text>
<rect x="192" y="213" width="85" height="47" rx="4" fill="#f3dfd4"/>
<text x="223" y="243" font-size="18" id="cell-matrix-0-1" data-value="-1">-1</text>
<rect x="284" y="213" width="85" height="47" rx="4" fill="#d8ede7"/>
<text x="315" y="243" font-size="18" id="cell-matrix-0-2" data-value="1">1</text>
<text x="65" y="294" font-size="16" >1</text>
<rect x="100" y="268" width="85" height="47" rx="4" fill="#d8ede7"/>
<text x="131" y="298" font-size="18" id="cell-matrix-1-0" data-value="1">1</text>
<rect x="192" y="268" width="85" height="47" rx="4" fill="#ececec"/>
<text x="223" y="298" font-size="18" id="cell-matrix-1-1" data-value="0">0</text>
<rect x="284" y="268" width="85" height="47" rx="4" fill="#f3dfd4"/>
<text x="315" y="298" font-size="18" id="cell-matrix-1-2" data-value="-1">-1</text>
<text x="65" y="349" font-size="16" >2</text>
<rect x="100" y="323" width="85" height="47" rx="4" fill="#f3dfd4"/>
<text x="131" y="353" font-size="18" id="cell-matrix-2-0" data-value="-1">-1</text>
<rect x="192" y="323" width="85" height="47" rx="4" fill="#d8ede7"/>
<text x="223" y="353" font-size="18" id="cell-matrix-2-1" data-value="1">1</text>
<rect x="284" y="323" width="85" height="47" rx="4" fill="#ececec"/>
<text x="315" y="353" font-size="18" id="cell-matrix-2-2" data-value="0">0</text>
<text x="470" y="213" font-size="17" >Game value</text>
<text x="770" y="213" font-size="18" id="cell-value" data-value="0">0</text>
<text x="470" y="254" font-size="17" >Pure row security</text>
<text x="770" y="254" font-size="18" id="cell-row_maximin" data-value="-1">-1</text>
<text x="470" y="295" font-size="17" >Pure column security</text>
<text x="770" y="295" font-size="18" id="cell-column_minimax" data-value="1">1</text>
<text x="470" y="337" font-size="17" >Mixed equilibrium: each action has probability 1/3.</text>
<text x="470" y="368" font-size="17" >Both always choose action 0: payoff 0, deviation gap 2.</text>
<text x="42" y="421" font-size="21" font-weight="700">2 Duplicate actions create a continuum of optimal policies</text>
<text x="42" y="450" font-size="16" class="muted">Rows 0 and 1 duplicate [1,-1]; row 2 is [-1,1]; row 3 is dominated [-2,-2].</text>
<text x="60" y="491" font-size="16" font-weight="700">Row</text>
<text x="170" y="491" font-size="16" font-weight="700">Attainable probability range</text>
<text x="620" y="491" font-size="16" font-weight="700">Optimal vertex 0</text>
<text x="835" y="491" font-size="16" font-weight="700">Optimal vertex 1</text>
<text x="65" y="533" font-size="17" >0</text>
<line x1="180" y1="527" x2="530" y2="527" stroke="#ddd" stroke-width="8"/>
<line id="range-0" data-min="0" data-max="1/2" x1="180.000" y1="527" x2="355.000" y2="527" stroke="#127e71" stroke-width="8"/>
<circle id="range-0-minimum" cx="180.000" cy="527" r="5" fill="#127e71"/>
<circle id="range-0-maximum" cx="355.000" cy="527" r="5" fill="#127e71"/>
<text x="640" y="533" font-size="18" id="cell-vertex-0-0" data-value="0">0</text>
<text x="855" y="533" font-size="18" id="cell-vertex-1-0" data-value="1/2">1/2</text>
<text x="65" y="580" font-size="17" >1</text>
<line x1="180" y1="574" x2="530" y2="574" stroke="#ddd" stroke-width="8"/>
<line id="range-1" data-min="0" data-max="1/2" x1="180.000" y1="574" x2="355.000" y2="574" stroke="#127e71" stroke-width="8"/>
<circle id="range-1-minimum" cx="180.000" cy="574" r="5" fill="#127e71"/>
<circle id="range-1-maximum" cx="355.000" cy="574" r="5" fill="#127e71"/>
<text x="640" y="580" font-size="18" id="cell-vertex-0-1" data-value="1/2">1/2</text>
<text x="855" y="580" font-size="18" id="cell-vertex-1-1" data-value="0">0</text>
<text x="65" y="627" font-size="17" >2</text>
<line x1="180" y1="621" x2="530" y2="621" stroke="#ddd" stroke-width="8"/>
<line id="range-2" data-min="1/2" data-max="1/2" x1="355.000" y1="621" x2="355.000" y2="621" stroke="#127e71" stroke-width="8"/>
<circle id="range-2-minimum" cx="355.000" cy="621" r="5" fill="#127e71"/>
<circle id="range-2-maximum" cx="355.000" cy="621" r="5" fill="#127e71"/>
<text x="640" y="627" font-size="18" id="cell-vertex-0-2" data-value="1/2">1/2</text>
<text x="855" y="627" font-size="18" id="cell-vertex-1-2" data-value="1/2">1/2</text>
<text x="65" y="674" font-size="17" >3</text>
<line x1="180" y1="668" x2="530" y2="668" stroke="#ddd" stroke-width="8"/>
<line id="range-3" data-min="0" data-max="0" x1="180.000" y1="668" x2="180.000" y2="668" stroke="#127e71" stroke-width="8"/>
<circle id="range-3-minimum" cx="180.000" cy="668" r="5" fill="#127e71"/>
<circle id="range-3-maximum" cx="180.000" cy="668" r="5" fill="#127e71"/>
<text x="640" y="674" font-size="18" id="cell-vertex-0-3" data-value="0">0</text>
<text x="855" y="674" font-size="18" id="cell-vertex-1-3" data-value="0">0</text>
<text x="180" y="722" font-size="14" >0</text>
<text x="350" y="722" font-size="14" >1/2</text>
<text x="525" y="722" font-size="14" >1</text>
<text x="42" y="760" font-size="17" >The full face is p0+p1=1/2, p2=1/2, p3=0. Coordinate ranges are not independent.</text>
<text x="42" y="791" font-size="17" >Representative (vertex average): [1/4,1/4,1/2,0]. No claim that this policy is uniquely preferred.</text>
<text x="42" y="846" font-size="21" font-weight="700">3 Tiny payoff changes can flip the unique optimal action</text>
<text x="42" y="876" font-size="16" class="muted">Two row actions, one column action. Before: [0,epsilon]; after: [epsilon,0].</text>
<text x="52" y="920" font-size="16" font-weight="700">epsilon</text>
<text x="350" y="920" font-size="16" font-weight="700">Value change</text>
<text x="630" y="920" font-size="16" font-weight="700">Old pair deviation gap after change</text>
<text x="52" y="953" font-size="18" id="cell-epsilon" data-value="1/1000000000000">1/1000000000000</text>
<text x="350" y="953" font-size="18" id="cell-value-change" data-value="0">0</text>
<text x="630" y="953" font-size="18" id="cell-transfer-gap" data-value="1/1000000000000">1/1000000000000</text>
<text x="42" y="999" font-size="17" >Optimal row policy flips [0,1] to [1,0], despite unchanged value and a 10^-12 entry change.</text>
<text x="42" y="1032" font-size="17" >Value changes by at most epsilon; an old equilibrium pair has deviation gap at most 2*epsilon.</text>
<text x="42" y="1080" font-size="16" >Every active basis, singular/infeasible outcome, slack, optimal vertex and coordinate witness is exported.</text>
<text x="42" y="1120" font-size="15" class="muted">Developed finite tables only. No general-sum games, learned opponent, unique-policy or scalability claim.</text>
<text x="42" y="1150" font-size="15" class="muted">Perturbation bounds are deterministic, not confidence intervals for unknown empirical scores.</text>
