name: GameLab checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m gamelab demo > /tmp/demo.json && cmp /tmp/demo.json examples/demo.json
      - run: python examples/render_demo.py --check
      - run: python examples/render_intervals.py --check
      - run: python -m gamelab interval-demo > /tmp/interval-demo.json && cmp /tmp/interval-demo.json examples/interval-demo.json
      - run: |
          python -m gamelab solve examples/solve-input.json > /tmp/solve.json
          python -m gamelab audit examples/audit-input.json > /tmp/audit.json
          python -m gamelab perturbation examples/perturbation-input.json > /tmp/perturbation.json
          python -m gamelab intervals examples/intervals-input.json > /tmp/intervals.json
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip wheel . --no-deps -w /tmp/wheels
      - run: python -m pip install --target /tmp/installed /tmp/wheels/*.whl
      - run: |
          for mode in demo solve audit perturbation interval-demo intervals; do
            if [ "$mode" = demo ] || [ "$mode" = interval-demo ]; then
              python -m gamelab "$mode" > /tmp/source-$mode.json
              (cd /tmp && PYTHONPATH=/tmp/installed python -m gamelab "$mode") > /tmp/wheel-$mode.json
            else
              python -m gamelab "$mode" "examples/$mode-input.json" > /tmp/source-$mode.json
              (cd /tmp && PYTHONPATH=/tmp/installed python -m gamelab "$mode" "$GITHUB_WORKSPACE/examples/$mode-input.json") > /tmp/wheel-$mode.json
            fi
            cmp /tmp/source-$mode.json /tmp/wheel-$mode.json
          done
